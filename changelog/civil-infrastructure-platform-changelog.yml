note: >-
  CIP publishes NO changelog for its REST surface. The events API is generated by
  the upstream The Events Calendar WordPress plugin and CIP announces nothing about
  it; https://cip-project.org/changelog is 404. What CIP does publish, on a dense
  and verifiable cadence, is a PRODUCT release stream: signed release tags on the
  SLTS kernel and on the CIP Core reference images, in its own GitLab group. Those
  tags are the closest thing to a dated changelog this project maintains, and they
  are recorded here as such — explicitly labelled product releases, not API
  versions, so nothing downstream reads them as a contract history.
scheme:
  api_changelog: none
  product_changelog: git release tags, no prose release notes
  kernel_version_form: v<upstream kernel version>-cip<N>[-rt<M>]
  kernel_note: >-
    The -cipN suffix is CIP's own increment on top of the upstream stable release
    it rebases; -rt variants carry the PREEMPT_RT patch set. A "-rebase" tag marks
    the rebase point and is not itself a release.
  core_version_form: v<major>.<minor>, with a -rc1 candidate preceding each release
release_notes_published: false
release_notes_note: >-
  Neither project attaches GitLab Release objects or release-note bodies to its
  tags — the /releases endpoint returns an empty list for isar-cip-core. The tag
  name and its commit date are the entire published record, so no highlights,
  breaking-change flags or additions can be reported without inventing them.
