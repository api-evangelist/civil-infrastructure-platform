capabilities:
  - id: civil-infrastructure-platform.maintain-slts-kernel
    name: Maintain Super Long-Term Support kernel
    description: >-
      Track upstream Linux kernel changes, backport fixes, and release
      a kernel branch supported for ten or more years for industrial use.
    apis:
      - civil-infrastructure-platform:cip-kernel
  - id: civil-infrastructure-platform.curate-base-platform
    name: Curate industrial base platform
    description: >-
      Curate Debian-derived user-space packages aligned to the SLTS
      kernel as a reference platform for civil infrastructure devices.
    apis:
      - civil-infrastructure-platform:cip-core
  - id: civil-infrastructure-platform.deliver-software-updates
    name: Deliver software updates
    description: >-
      Provide tooling and reference implementations for secure
      over-the-air software updates on long-lived industrial systems.
    apis:
      - civil-infrastructure-platform:cip-software-update
  - id: civil-infrastructure-platform.align-iec-62443
    name: Align with IEC 62443 industrial security
    description: >-
      Track CVEs, harden kernel and user-space components, and align
      the CIP base layer with IEC 62443-4-1 and 62443-4-2 requirements.
    apis:
      - civil-infrastructure-platform:cip-security
  - id: civil-infrastructure-platform.run-ci-testing
    name: Run continuous integration testing
    description: >-
      Operate continuous-integration and hardware-in-the-loop testing
      across member-supplied boards to validate the SLTS branch.
    apis:
      - civil-infrastructure-platform:cip-testing
