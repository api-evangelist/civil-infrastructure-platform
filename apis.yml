description: >-
  The Civil Infrastructure Platform (CIP) is a Linux Foundation
  collaborative project that builds an industrial-grade open source base
  layer for civil infrastructure systems such as transportation, power
  generation and distribution, building and city management, industrial
  control, and healthcare equipment. CIP curates a Super Long-Term
  Support (SLTS) kernel and core user-space packages that can be
  maintained for more than ten years, plus working groups for security
  (IEC 62443 alignment), software update, real-time, and testing. CIP's
  primary programmable interface is source code — the kernel, CIP Core
  images and tooling published through GitLab and Debian-derived package
  archives — and it publishes machine-readable product lifecycle data for
  those. CIP also serves one live REST API: its own event calendar at
  cip-project.org/wp-json, declared in an RFC 9727 /.well-known/api-catalog
  and described by OpenAPI documents the site serves itself.
apis:
  - aid: civil-infrastructure-platform:cip-kernel
    name: CIP SLTS Kernel
    tags:
      - Embedded
      - Kernel
      - Linux
      - SLTS
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://wiki.linuxfoundation.org/civilinfrastructureplatform/cipkernelmaintenance
    properties:
      - url: https://wiki.linuxfoundation.org/civilinfrastructureplatform/cipkernelmaintenance
        type: Documentation
      - url: https://gitlab.com/cip-project/cip-kernel
        type: Source Code
    description: >-
      The CIP Kernel is a Super Long-Term Support (SLTS) Linux kernel
      branch maintained for ten or more years, providing a stable base
      for industrial systems that must remain in service across
      multi-decade lifecycles.
  - aid: civil-infrastructure-platform:cip-core
    name: CIP Core Packages
    tags:
      - Debian
      - Packages
      - Userspace
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://wiki.linuxfoundation.org/civilinfrastructureplatform/cipcore
    properties:
      - url: https://wiki.linuxfoundation.org/civilinfrastructureplatform/cipcore
        type: Documentation
      - url: https://gitlab.com/cip-project/cip-core
        type: Source Code
    description: >-
      CIP Core provides a curated set of Debian-derived user-space
      packages aligned with the SLTS kernel to deliver a complete
      reference platform for civil infrastructure devices.
  - aid: civil-infrastructure-platform:cip-software-update
    name: CIP Software Update
    tags:
      - OTA
      - Software Update
      - SWUpdate
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://wiki.linuxfoundation.org/civilinfrastructureplatform/softwareupdate
    properties:
      - url: https://wiki.linuxfoundation.org/civilinfrastructureplatform/softwareupdate
        type: Documentation
    description: >-
      The CIP Software Update working group maintains tooling such as
      SWUpdate and hawkBit-based servers used to deliver secure
      over-the-air updates across long-lived industrial deployments.
  - aid: civil-infrastructure-platform:cip-security
    name: CIP Security
    tags:
      - IEC 62443
      - Industrial Security
      - Security
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://wiki.linuxfoundation.org/civilinfrastructureplatform/cipsecurity
    properties:
      - url: https://wiki.linuxfoundation.org/civilinfrastructureplatform/cipsecurity
        type: Documentation
    description: >-
      The CIP Security working group aligns the CIP base layer with
      IEC 62443-4-1 and 62443-4-2 industrial cybersecurity requirements
      and tracks CVE handling across the SLTS kernel and user-space.
  - aid: civil-infrastructure-platform:cip-testing
    name: CIP Testing
    tags:
      - CI
      - LAVA
      - Testing
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://wiki.linuxfoundation.org/civilinfrastructureplatform/ciptesting
    properties:
      - url: https://wiki.linuxfoundation.org/civilinfrastructureplatform/ciptesting
        type: Documentation
    description: >-
      The CIP Testing working group runs continuous-integration and
      hardware-in-the-loop testing on member-supplied boards to validate
      kernel and core packages against the SLTS branch.
  - aid: civil-infrastructure-platform:cip-events-api
    name: CIP Events REST API
    tags:
      - Calendar
      - Events
      - REST
      - WordPress
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://cip-project.org/events
    baseURL: https://cip-project.org/wp-json/tec/v1
    properties:
      - url: openapi/civil-infrastructure-platform-tec-v1-openapi-original.json
        type: OpenAPI
        name: CIP Events REST API (tec/v1)
      - url: openapi/civil-infrastructure-platform-events-openapi-original.json
        type: OpenAPI
        name: CIP Events REST API (tribe/events/v1)
      - url: openapi/civil-infrastructure-platform-zapier-openapi-original.json
        type: OpenAPI
        name: CIP Events Zapier authorization surface
      - url: overlays/civil-infrastructure-platform-tec-v1-overlay.yaml
        type: Overlay
      - url: overlays/civil-infrastructure-platform-events-overlay.yaml
        type: Overlay
      - url: overlays/civil-infrastructure-platform-zapier-overlay.yaml
        type: Overlay
      - url: https://cip-project.org/wp-json/tec/v1/docs
        type: OpenAPI
        name: Live self-served OpenAPI 3.0.4 document
    description: >-
      The only live, callable REST API the Civil Infrastructure Platform
      serves: the community event calendar behind cip-project.org/events,
      exposing events, venues, organizers and series. Published reads are
      unauthenticated; writes require HTTP Basic with a WordPress
      Application Password. CIP declares it in its own RFC 9727
      /.well-known/api-catalog, and the site serves OpenAPI documents
      describing it at /wp-json/tec/v1/docs and
      /wp-json/tribe/events/v1/doc. The contracts are generated by The
      Events Calendar (StellarWP) WordPress plugin CIP runs on its site,
      so info.title and info.contact name the plugin vendor while
      servers[] names cip-project.org and the deployed instance and its
      data are CIP's.
