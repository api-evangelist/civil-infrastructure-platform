description: 'The Civil Infrastructure Platform (CIP) is a Linux Foundation collaborative project that
  builds an industrial-grade open source base layer for civil infrastructure systems such as transportation,
  power generation and distribution, building and city management, industrial control, and healthcare
  equipment. CIP curates a Super Long-Term Support (SLTS) kernel and core user-space packages that can
  be maintained for more than ten years, plus working groups for security (IEC 62443 alignment), software
  update, real-time, and testing. CIP''s primary programmable interface is source code — the kernel, CIP
  Core images and tooling published through GitLab and Debian-derived package archives — and it publishes
  machine-readable product lifecycle data for those. CIP also serves one live REST API: its own event
  calendar at cip-project.org/wp-json, declared in an RFC 9727 /.well-known/api-catalog and described
  by OpenAPI documents the site serves itself.'
